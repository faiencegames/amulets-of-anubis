<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amulets of Anubis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2026%2038%22%3E%3Cpath%20d%3D%22M13%202c-5%200-7.5%204.5-7.5%208.5%200%203%201.6%205.6%203.6%207.5H2v5h8.6L9%2036h8l-1.6-13H24v-5h-7.1c2-1.9%203.6-4.5%203.6-7.5C20.5%206.5%2018%202%2013%202zm0%204.5c1.6%200%202.8%201.8%202.8%204.2S14.6%2016%2013%2016s-2.8-2.9-2.8-5.3S11.4%206.5%2013%206.5z%22%20fill%3D%22%23c8962e%22%2F%3E%3C%2Fsvg%3E">
<style id="fonts">
/*FONTS*/
</style>
<style>
/*STYLES*/
</style>
</head>
<body class="booting">
<div id="backdrop" aria-hidden="true"><div class="bd"></div><div class="bd"></div></div>
<div class="app">

	<header class="hud stone">
		<div class="hud-title">{{svg:ui/title-ankh class="orn"}}<h1>Amulets of Anubis</h1></div>
		<div class="hud-prog" aria-hidden="true"><i id="hudProgFill"></i></div>
		<div class="gauges">
			<div class="gauge g-moves" id="gMoves" title="{{hud.moves_title}}"><span class="g-ico">&#8635;</span><b id="movesNum">25</b><small>{{hud.moves}}</small></div>
			<div class="gauge g-gold" title="{{hud.gold_title}}"><span class="g-ico gold"></span><b id="goldTxt">0</b><small>{{hud.gold}}</small></div>
			<div class="gauge g-lapis" title="{{hud.lapis_title}}"><span class="g-ico lapis"></span><b id="lapisTxt">0</b><small>{{hud.lapis}}</small></div>
			<div class="gauge g-relics" title="{{hud.relics_title}}"><span class="g-ico relic"></span><b id="relicTxt">0/8</b><small>{{hud.relics}}</small></div>
			<div class="gauge g-score wide" title="{{hud.score_title}}"><b id="scoreTxt">0</b><small>{{hud.score}}</small></div>
			<div class="gauge g-stop" title="{{hud.stop_title}}"><b id="stopTxt">1/12</b><small>{{hud.stop}}</small></div>
		</div>
	</header>

	<main class="stage">
		<aside class="side">
			<div class="scroll">
				<div class="rod"></div>
				<details class="sheet papyrus" id="infoSheet" open>
					<summary><h2 class="place" id="placeName">Memphis</h2><p class="place-sub" id="placeSub"></p></summary>
					<p class="fact" id="placeFact"></p>
					<button class="read-on" id="placeMore" type="button" hidden>{{place.read_on}}</button>
					<div class="legend" id="legend"></div>
				</details>
				<div class="rod"></div>
			</div>
			<div class="tablet stone">
				<div class="tablet-row"><span>{{side.difficulty}}</span><button type="button" class="diff-link" id="diffTxt" aria-label="{{side.change_difficulty}}" title="{{side.change_difficulty}}">Normal</button></div>
				<div class="tablet-row"><span>{{side.stars}}</span><strong id="starTxt">0 / 36</strong></div>
				<div class="trial-row" id="trialRow" hidden></div>
				<div class="boon-row" id="boonRow"></div>
			</div>
			<div class="tablet stone collection">
				<div class="tablet-row"><span>{{side.relics}}</span><strong id="relicTxt2">0 / 8</strong><button class="museum-link" id="openMuseum" type="button" title="{{side.open_museum_title}}">{{side.open_museum}}</button></div>
				<div class="relic-strip" id="relicStrip" title="{{side.open_museum_title}}"></div>
			</div>
		</aside>

		<section class="playfield">
			<div class="board-frame">
				<span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
				<div class="band"></div>
				<div class="canvas-wrap"><div id="boardBg" aria-hidden="true"></div><canvas id="board" tabindex="0" aria-label="{{hud.board_label}}"></canvas></div>
				<div class="band bottom"></div>
			</div>
			<div class="tube" id="tube" role="img" aria-label="{{hud.gilded_label}}">
				<div class="tube-cap top"></div>
				<div class="tube-body"><div class="tube-stream"></div><div class="tube-fill" id="tubeFill"></div><div class="tube-shine"></div></div>
				<div class="tube-cap bottom"></div>
				<span class="tube-txt" id="gildTxt">0 / 36</span>
			</div>
		</section>

		<div class="mobile-strip" id="mobileStrip">
			<button class="strip-place" id="stripPlace" type="button"></button>
			<div class="trial-row" id="trialRowM" hidden></div>
			<div class="boon-row" id="boonRowM"></div>
		</div>
	</main>

	<nav class="dock stone" aria-label="{{dock.controls}}">
		<button class="rbtn" id="btnMap" title="{{dock.map_title}}" aria-label="{{dock.map_title}}">{{svg:dock/map}}<em>{{dock.map}}</em></button>
		<button class="rbtn" id="btnHint" title="{{dock.hint_title}}" aria-label="{{dock.hint_title}}">{{svg:dock/hint}}<em>{{dock.hint}}</em></button>
		<button class="rbtn" id="btnAmulets" title="{{dock.amulets_title}}" aria-label="{{dock.amulets_title}}">{{svg:dock/amulets}}<em>{{dock.amulets}}</em></button>
		<button class="rbtn" id="btnRestart" title="{{dock.restart_title}}" aria-label="{{dock.restart_title}}">{{svg:dock/restart}}<em>{{dock.restart}}</em></button>
		<button class="rbtn" id="btnTreasury" title="{{dock.treasury_title}}" aria-label="{{dock.treasury_title}}">{{svg:dock/treasury}}<em>{{dock.treasury}}</em></button>
		<button class="rbtn" id="btnStall" title="{{dock.stall_title}}" aria-label="{{dock.stall_title}}">{{svg:dock/stall}}<em>{{dock.stall}}</em></button>
		<button class="rbtn" id="btnHelp" title="{{dock.help_title}}" aria-label="{{dock.help_title}}">{{svg:dock/help}}<em>{{dock.help}}</em></button>
		<button class="rbtn" id="btnCustomise" title="{{dock.customise_title}}" aria-label="{{dock.customise_title}}">{{svg:dock/customise}}<em>{{dock.customise}}</em></button>
		<button class="rbtn" id="btnMenu" title="{{dock.menu_title}}" aria-label="{{dock.menu_title}}">{{svg:dock/menu}}<em>{{dock.menu}}</em></button>
	</nav>
</div>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="overlay title-screen" id="ovTitle" role="dialog" aria-modal="true" aria-labelledby="titleName">
	<div class="title-body" id="titleBody"></div>
</div>
<div class="overlay" id="ovMsg" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
	<div class="scroll"><div class="rod"></div><button class="close-x" type="button" aria-label="{{dock.close}}" title="{{dock.close}}">&times;</button><div class="sheet papyrus" id="msgBody"></div><div class="rod"></div></div>
</div>
<div class="overlay" id="ovMap" role="dialog" aria-modal="true" aria-label="{{dock.map_scroll}}">
	<div class="scroll"><div class="rod"></div><button class="close-x" type="button" aria-label="{{dock.close}}" title="{{dock.close}}">&times;</button><div class="sheet papyrus" id="mapBody"></div><div class="rod"></div></div>
</div>

<script>
/*CORE*/
</script>
<script>
/*UI*/
</script>
</body>
</html>
