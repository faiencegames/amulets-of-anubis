<!-- The sanctuary of Abu Simbel: four seated Gods cut from the rock at the back of the temple, from the left Ptah, Amun-Ra, the deified Ramesses II and Ra-Horakhty. Twice a year the rising sun reaches down the temple and lights three of them; Ptah stays in the dark. A stone stand for the sacred boat before them. Drawn by a script. 1600 by 1000. -->
