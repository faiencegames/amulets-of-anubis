<!-- Abu Simbel at dawn: the great temple of Ramesses II, cut into the cliff. Four seated colossi of the king; the second from the left fell in an earthquake soon after it was carved, and the pieces lie at its feet. Ra-Horakhty in the niche over the door, baboons greeting the sun along the top. The temple faces east, so the rising sun behind us lights its front. Drawn by tools/scenery/abu_simbel.py. 1600 by 1000. -->
