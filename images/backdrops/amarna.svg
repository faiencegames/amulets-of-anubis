<!-- Amarna at noon: the Aten, the sun's disc, with rays ending in hands as the carvings of Amarna show it, some holding the ankh. Below, the low ruins of Akhenaten's city on its plain, the open courts of the Great Aten Temple with rows of offering tables, and the cliffs of the eastern desert. Drawn by tools/scenery/amarna.py. 1600 by 1000. -->
