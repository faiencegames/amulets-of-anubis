<!-- Abydos, resting place of Osiris: the pillared front of Seti I's temple at dusk, lamps lit, under the desert cliffs. 1600 by 1000. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b2248"/><stop offset=".35" stop-color="#3f3768"/><stop offset=".55" stop-color="#9a5a6a"/><stop offset=".66" stop-color="#e79a62"/>
  </linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8a870"/><stop offset="1" stop-color="#a87444"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a44"/><stop offset="1" stop-color="#3a2230"/></linearGradient>
  <radialGradient id="lamp"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/><stop offset=".3" stop-color="#ffb34a" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<g fill="#fff8e0">
  <circle cx="140" cy="80" r="2"/><circle cx="310" cy="150" r="1.6"/><circle cx="470" cy="60" r="2.2"/><circle cx="620" cy="190" r="1.4"/><circle cx="790" cy="90" r="1.8"/>
  <circle cx="930" cy="170" r="1.5"/><circle cx="1080" cy="60" r="2"/><circle cx="1230" cy="140" r="1.6"/><circle cx="1390" cy="70" r="2.2"/><circle cx="1520" cy="180" r="1.5"/>
  <circle cx="220" cy="260" r="1.3"/><circle cx="700" cy="300" r="1.2"/><circle cx="1160" cy="280" r="1.3"/><circle cx="1460" cy="300" r="1.2"/>
</g>
<path d="M1296 150 A44 44 0 1 0 1340 204 A34 34 0 1 1 1296 150 Z" fill="#fbf0cc"/>
<!-- the desert cliffs behind -->
<path d="M0 560 L120 520 L260 530 L380 480 L520 500 L640 470 L780 492 L900 460 L1040 486 L1180 468 L1320 500 L1460 476 L1600 510 V640 H0 Z" fill="#5a3a52"/>
<path d="M0 600 L180 570 L340 584 L500 556 L700 576 L880 552 L1060 574 L1240 556 L1420 580 L1600 562 V660 H0 Z" fill="#6e4658"/>
<!-- the temple: a terrace, a roofed portico of square pillars -->
<rect x="170" y="700" width="1260" height="40" fill="#8a5a3c"/>
<rect x="170" y="700" width="1260" height="8" fill="#c08a5a"/>
<rect x="210" y="540" width="1180" height="40" fill="url(#face)"/>
<rect x="210" y="530" width="1180" height="14" fill="#e8bc84"/>
<rect x="210" y="580" width="1180" height="120" fill="#3a2230"/>
<g fill="url(#face)">
  <rect x="222" y="580" width="44" height="120"/><rect x="318" y="580" width="44" height="120"/><rect x="414" y="580" width="44" height="120"/><rect x="510" y="580" width="44" height="120"/>
  <rect x="606" y="580" width="44" height="120"/><rect x="702" y="580" width="44" height="120"/><rect x="854" y="580" width="44" height="120"/><rect x="950" y="580" width="44" height="120"/>
  <rect x="1046" y="580" width="44" height="120"/><rect x="1142" y="580" width="44" height="120"/><rect x="1238" y="580" width="44" height="120"/><rect x="1334" y="580" width="44" height="120"/>
</g>
<g fill="#8a5a3c" opacity=".55">
  <rect x="254" y="580" width="12" height="120"/><rect x="350" y="580" width="12" height="120"/><rect x="446" y="580" width="12" height="120"/><rect x="542" y="580" width="12" height="120"/>
  <rect x="638" y="580" width="12" height="120"/><rect x="734" y="580" width="12" height="120"/><rect x="886" y="580" width="12" height="120"/><rect x="982" y="580" width="12" height="120"/>
  <rect x="1078" y="580" width="12" height="120"/><rect x="1174" y="580" width="12" height="120"/><rect x="1270" y="580" width="12" height="120"/><rect x="1366" y="580" width="12" height="120"/>
</g>
<!-- the central doorway, glowing -->
<rect x="762" y="600" width="76" height="100" fill="#ffcf7a"/>
<rect x="772" y="612" width="56" height="88" fill="#ffe7ae"/>
<!-- carved band along the roof -->
<g fill="#a87444" opacity=".7"><rect x="240" y="552" width="1120" height="4"/><rect x="240" y="564" width="1120" height="3"/></g>
<!-- lamps between the pillars -->
<g>
  <circle cx="292" cy="650" r="70" fill="url(#lamp)"/><circle cx="580" cy="650" r="70" fill="url(#lamp)"/><circle cx="800" cy="650" r="110" fill="url(#lamp)"/>
  <circle cx="1020" cy="650" r="70" fill="url(#lamp)"/><circle cx="1308" cy="650" r="70" fill="url(#lamp)"/>
</g>
<g fill="#fff2c0"><circle cx="292" cy="652" r="5"/><circle cx="580" cy="652" r="5"/><circle cx="1020" cy="652" r="5"/><circle cx="1308" cy="652" r="5"/></g>
<!-- a ramp up to the doorway, the desert in front -->
<path d="M0 740 H1600 V1000 H0 Z" fill="url(#ground)"/>
<path d="M740 740 H860 L960 1000 H640 Z" fill="#b07a54" opacity=".6"/>
<g fill="#2a1822" opacity=".5"><path d="M0 820 C300 790 600 830 900 810 C1200 790 1400 820 1600 800 V1000 H0 Z"/></g>
<!-- two torch-bearers' lamps along the path -->
<g><circle cx="640" cy="760" r="60" fill="url(#lamp)"/><circle cx="960" cy="760" r="60" fill="url(#lamp)"/>
<rect x="636" y="760" width="8" height="60" fill="#3a2230"/><rect x="956" y="760" width="8" height="60" fill="#3a2230"/>
<circle cx="640" cy="756" r="7" fill="#fff2c0"/><circle cx="960" cy="756" r="7" fill="#fff2c0"/></g>
</svg>
