<!-- Anubis at the head of his stall: the jackal lying on his shrine chest, as in Tutankhamun's tomb. 64 by 46. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 46">
<defs>
<linearGradient id="stallJackal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a46"/><stop offset="1" stop-color="#08080c"/></linearGradient>
<linearGradient id="stallChest" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3cf64"/><stop offset="1" stop-color="#a8741a"/></linearGradient>
</defs>
<!-- the shrine chest, gilded, with its cornice -->
<path d="M5 31 H59 L57 35 H7 Z" fill="url(#stallChest)" stroke="#3b2406" stroke-width="1" stroke-linejoin="round"/>
<rect x="8" y="35" width="48" height="9" fill="url(#stallChest)" stroke="#3b2406" stroke-width="1"/>
<g fill="#1f3a8a"><rect x="12" y="37" width="3" height="5"/><rect x="24" y="37" width="3" height="5"/><rect x="37" y="37" width="3" height="5"/><rect x="49" y="37" width="3" height="5"/></g>
<g fill="#3b2406" opacity=".5"><rect x="17" y="38" width="4" height="1.4"/><rect x="29" y="38" width="5" height="1.4"/><rect x="42" y="38" width="4" height="1.4"/></g>
<!-- the jackal, lying on the lid (his whole underside on it), forelegs stretched out, head raised, his tail over the end -->
<path d="M57.8 26.4 C60.4 27.4 61.2 29.6 60.6 32.5 L59.8 42" fill="none" stroke="#c8962e" stroke-width="3" stroke-linecap="round"/>
<path d="M57.8 26.4 C60.4 27.4 61.2 29.6 60.6 32.5 L59.8 42" fill="none" stroke="#14141a" stroke-width="1.3" stroke-linecap="round"/>
<path d="M13.4 11.2 L20 10.2 C22 9.8 24 9 25.8 7.6 L28.6 0.6 L31.2 8.8 C33.2 11 33.4 14 34.6 16.6 C36 18.6 38.5 19.2 42 19.2 L49 19.2 C54.4 19 58.6 22 58.4 26 C58.2 28.6 57.2 30.2 55.4 31 L11 31 C9.6 31 9.6 28.4 11 28.4 L24 28.2 C25 26 25.6 23.6 25 21.4 C24.4 18.6 23.4 16.6 21.6 15.2 L15.2 14.4 C13.4 14.3 12.2 13.6 12.2 12.6 C12.2 11.8 12.7 11.3 13.4 11.2 Z"
  fill="url(#stallJackal)" stroke="#c8962e" stroke-width="1.1" stroke-linejoin="round"/>
<!-- the ear's gold lining, the eye, the collar, the line of the haunch and the foreleg -->
<path d="M28.6 3.2 L30 8.4 L27 8.3 Z" fill="#e8b93e"/>
<path d="M19.6 10.9 C20.6 10.1 21.9 10 23 10.6 C21.9 11.4 20.6 11.5 19.6 10.9 Z" fill="#f3cf64"/>
<path d="M24.6 18.4 C27.6 19.9 31.2 19.6 34.4 17.6" fill="none" stroke="#e8b93e" stroke-width="2" stroke-linecap="round"/>
<path d="M45.6 30.6 C44.8 25.8 48 21.8 53 22" fill="none" stroke="#c8962e" stroke-width=".8" stroke-linecap="round" opacity=".7"/>
<path d="M14 29.6 L24 29.4" fill="none" stroke="#c8962e" stroke-width=".6" stroke-linecap="round" opacity=".6"/>
</svg>
