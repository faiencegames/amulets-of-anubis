<!-- An obelisk of pink Aswan granite with a gilded tip. 128 by 128. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<defs>
  <filter id="sh" x="-30%" y="-20%" width="160%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#190c00" flood-opacity=".55"/></filter>
  <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b8a8"/><stop offset="1" stop-color="#c77868"/></linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b86a5c"/><stop offset="1" stop-color="#7e3e36"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8c8"/><stop offset=".5" stop-color="#eec04a"/><stop offset="1" stop-color="#9a6a14"/></linearGradient>
  <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".9" fill="#5a2a24" opacity=".35"/><circle cx="6.5" cy="7" r=".7" fill="#fff" opacity=".3"/></pattern>
</defs>
<!-- outline and shadow -->
<path d="M44 114 L52 32 L64 10 L76 32 L84 114 Z M36 114 H92 V122 H36 Z" fill="#2e1a03" stroke="#2e1a03" stroke-width="8" stroke-linejoin="round" filter="url(#sh)"/>
<!-- base -->
<rect x="36" y="114" width="56" height="8" fill="#a86a4a"/>
<rect x="36" y="114" width="56" height="3" fill="#d8a080"/>
<!-- shaft: lit face and shaded face -->
<path d="M44 114 L52 32 L64 32 L64 114 Z" fill="url(#lit)"/>
<path d="M64 114 L64 32 L76 32 L84 114 Z" fill="url(#shade)"/>
<path d="M44 114 L52 32 L76 32 L84 114 Z" fill="url(#grain)"/>
<!-- carved signs down the lit face -->
<g fill="#7e3e36" opacity=".75">
  <ellipse cx="56" cy="44" rx="3" ry="2"/><rect x="54" y="52" width="4" height="7" rx="1"/>
  <path d="M53 66 h6 v2 h-2 v6 h-2 v-6 h-2 z"/><circle cx="56" cy="82" r="2.4"/>
  <path d="M53 90 q3 -4 6 0 q-3 4 -6 0 z"/><rect x="53.5" y="98" width="5" height="3" rx="1"/>
</g>
<!-- gilded pyramidion -->
<path d="M52 32 L64 10 L64 32 Z" fill="url(#gold)"/>
<path d="M64 10 L76 32 L64 32 Z" fill="#b8841c"/>
<path d="M52 32 H76" stroke="#2e1a03" stroke-width="2"/>
<!-- shine -->
<path d="M50.5 40 L47 104" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>
<path d="M57 22 L61 15" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
</svg>
