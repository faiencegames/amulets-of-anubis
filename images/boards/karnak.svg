<!-- Karnak, behind the board: a sandstone wall carved with columns of signs, under a painted band. 800 by 800. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c89a62"/><stop offset="1" stop-color="#9a6c3c"/></linearGradient>
  <pattern id="signs" width="80" height="200" patternUnits="userSpaceOnUse">
    <path d="M1 0 V200 M79 0 V200" stroke="#7a5230" stroke-width="2"/>
    <g fill="#7a5230" opacity=".8">
      <ellipse cx="40" cy="20" rx="14" ry="7"/>
      <path d="M32 40 h16 v5 h-5.5 v16 h-5 v-16 h-5.5 z"/>
      <circle cx="40" cy="78" r="9"/><circle cx="40" cy="78" r="3" fill="#c89a62"/>
      <path d="M24 102 q16 -12 32 0 q-16 12 -32 0 z"/>
      <path d="M36 118 h8 v30 h-8 z M28 124 h24 v5 h-24 z"/>
      <path d="M26 166 l6 -8 l6 8 l6 -8 l6 8 l6 -8" fill="none" stroke="#7a5230" stroke-width="3"/>
      <rect x="30" y="180" width="20" height="8" rx="2"/>
    </g>
    <g fill="#e8c088" opacity=".45">
      <ellipse cx="40" cy="18" rx="14" ry="2"/><path d="M32 40 h16 v1.5 h-16 z"/><path d="M36 118 h8 v1.5 h-8 z"/>
    </g>
  </pattern>
</defs>
<rect width="800" height="800" fill="url(#stone)"/>
<rect width="800" height="800" fill="url(#signs)"/>
<rect y="0" width="800" height="16" fill="#1f3a8a"/><rect y="16" width="800" height="8" fill="#e8c46a"/><rect y="24" width="800" height="12" fill="#a8341e"/><rect y="36" width="800" height="6" fill="#2e7d5b"/>
<rect y="400" width="800" height="12" fill="#1f3a8a" opacity=".85"/><rect y="412" width="800" height="6" fill="#e8c46a" opacity=".85"/>
</svg>
