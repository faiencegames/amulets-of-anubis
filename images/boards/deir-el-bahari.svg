<!-- Deir el-Bahari, behind the board: pale limestone blocks with a painted frieze, as on Hatshepsut's terraces. 800 by 800. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2e2c0"/><stop offset="1" stop-color="#d8bd8c"/></linearGradient>
  <pattern id="blocks" width="200" height="120" patternUnits="userSpaceOnUse">
    <rect width="200" height="120" fill="none"/>
    <path d="M0 0.5 H200 M0 60.5 H200 M0.5 0 V60 M100.5 60 V120" stroke="#b89a68" stroke-width="3"/>
    <path d="M3 4 H196 M3 64 H98 M104 64 H196" stroke="#fff6e0" stroke-width="2" opacity=".6"/>
  </pattern>
  <pattern id="frieze" width="80" height="44" patternUnits="userSpaceOnUse">
    <rect width="80" height="44" fill="#e8d4a8"/>
    <rect y="0" width="80" height="6" fill="#1f3a8a"/><rect y="38" width="80" height="6" fill="#1f3a8a"/>
    <path d="M20 34 C12 26 14 14 20 10 C26 14 28 26 20 34 Z" fill="#2e7d5b"/><path d="M60 34 C52 26 54 14 60 10 C66 14 68 26 60 34 Z" fill="#a8341e"/>
    <circle cx="40" cy="22" r="5" fill="#c8962e"/>
  </pattern>
</defs>
<rect width="800" height="800" fill="url(#stone)"/>
<rect width="800" height="800" fill="url(#blocks)"/>
<rect y="248" width="800" height="44" fill="url(#frieze)"/>
<rect y="608" width="800" height="44" fill="url(#frieze)"/>
</svg>
